name: CI

# Runs on pull requests into main, and on main itself so the merged commit is
# verified rather than only the branch it came from.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS. `npm` cache keys off package-lock.json, which is committed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Four checks in one sequential job, each answering a different question.
      # Kept separate so a failure names the layer that broke rather than
      # reporting one opaque red step.
      #
      # `if: always()` lets the later steps run even after an earlier failure:
      # one push then reports every problem at once instead of revealing them
      # one re-run at a time.
      - name: Test
        run: npm test

      - name: Typecheck
        # Catches what tests cannot: the vitest environment is Node-only, so a
        # break in the .tsx components surfaces here and nowhere else.
        if: always()
        run: npm run typecheck

      - name: Lint
        if: always()
        run: npm run lint

      - name: Build
        # No environment variables are set: every entry in the env schema is
        # optional or defaulted, so a clean checkout builds without secrets.
        # Keep it that way — CI must never need production credentials.
        if: always()
        run: npm run build
